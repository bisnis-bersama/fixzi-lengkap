<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070D">
<title>FIXZY BUSINESS — Digital Command Center</title>
<style>
:root{--black:#05070D;--black2:#101522;--yellow:#FFD400;--yellow2:#FFE66D;--blue:#0756D9;--ink:#171717;--muted:#666;--line:#e8e8e8;--white:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--black);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{color:inherit}
.shell{width:min(1180px,calc(100% - 40px));margin:auto}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-frame{width:48px;height:48px;display:grid;place-items:center;background:#050505;border:1px solid var(--yellow);border-radius:13px;overflow:hidden;box-shadow:0 0 20px #FFD4001a}
.logo-frame img{width:100%;height:100%;object-fit:contain;padding:4px}
.brand-label{font-size:9px;letter-spacing:2.8px;color:var(--yellow);font-weight:900}
.brand-name{font-size:19px;font-weight:950;letter-spacing:1.1px;margin-top:3px}
.top-right{display:flex;align-items:center;gap:10px}
.live{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#e8e8e8;border:1px solid #383838;border-radius:99px;padding:9px 12px}
.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yellow);margin-right:8px;box-shadow:0 0 9px var(--yellow)}
.top-tag{font-size:10px;color:#111;background:var(--yellow);font-weight:950;letter-spacing:1px;padding:9px 11px;border-radius:7px}

/* PROMO FIXZY BUSINESS */
.promo-wrap{padding:24px 0 8px}
.promo-frame{position:relative;display:block;max-width:100%;overflow:hidden;border:1px solid #8f7610;border-radius:20px;background:#030303;box-shadow:0 18px 55px #0009,0 0 32px #ffd40012}
.promo-frame img{display:block;width:100%;height:auto;max-height:760px;object-fit:contain;object-position:center;background:#030303;transition:transform .35s}
.promo-frame:hover img{transform:scale(1.012)}
.promo-link{display:flex;justify-content:center;align-items:center;gap:10px;margin:15px auto 0;width:max-content;max-width:100%;min-height:45px;padding:0 22px;border-radius:9px;background:linear-gradient(135deg,#ffe66d,#ffd400);color:#111;text-decoration:none;font-size:11px;font-weight:950;letter-spacing:.7px;box-shadow:0 7px 25px #ffd40020;transition:.2s}
.promo-link:hover{transform:translateY(-2px);box-shadow:0 10px 30px #ffd40035}
.promo-note{text-align:center;color:#888;font-size:9px;letter-spacing:1.3px;margin:10px 0 0;font-weight:800}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;min-height:390px;padding:54px 0 48px;border-bottom:1px solid #ffffff1c;overflow:hidden}
.hero-copy{position:relative;z-index:2}
.kicker{display:inline-flex;align-items:center;gap:9px;color:var(--yellow);font-size:10px;font-weight:900;letter-spacing:2.3px;text-transform:uppercase}
.kicker:before{content:"";height:2px;width:26px;background:var(--yellow)}
h1{font-size:clamp(43px,6.6vw,78px);line-height:.94;letter-spacing:-4px;margin:19px 0 20px;font-weight:950}
h1 span{color:var(--yellow)}
.hero-copy p{max-width:580px;font-size:14px;line-height:1.85;color:#b7b7b7;margin:0}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn-main,.btn-ghost{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 17px;text-decoration:none;border-radius:8px;font-size:11px;font-weight:900;letter-spacing:.7px;transition:.2s}
.btn-main{background:var(--yellow);color:#111;border:1px solid var(--yellow)}
.btn-main:hover{background:var(--yellow2);transform:translateY(-2px);box-shadow:0 8px 24px #FFD40033}
.btn-ghost{border:1px solid #444;color:#f5f5f5}
.btn-ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.hero-visual{min-height:260px;position:relative;display:grid;place-items:center}
.visual-ring{width:min(290px,100%);aspect-ratio:1;border:1px solid #FFD4005c;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 90px #FFD4000d,inset 0 0 60px #FFD40008}
.visual-ring:before,.visual-ring:after{content:"";position:absolute;inset:18px;border:1px solid #ffffff20;border-radius:50%}
.visual-ring:after{inset:42px;border-color:#FFD40060}
.visual-core{width:118px;height:118px;background:linear-gradient(145deg,#FFE66D,#FFD400 60%,#b59a2c);color:#090909;display:grid;place-items:center;border-radius:29px;transform:rotate(-7deg);font-size:29px;font-weight:1000;letter-spacing:-2px;box-shadow:0 14px 55px #FFD40033}
.orbit-label{position:absolute;background:#151515;border:1px solid #454545;color:#f5f5f5;border-radius:8px;padding:9px 11px;font-size:9px;font-weight:900;letter-spacing:1px}
.ol1{top:22px;right:4px}.ol2{bottom:28px;left:0}.ol3{bottom:3px;right:25px;color:var(--yellow);border-color:#FFD40055}
.spark{position:absolute;width:8px;height:8px;background:var(--yellow);border-radius:50%;box-shadow:0 0 14px var(--yellow)}
.s1{top:17%;left:22%}.s2{top:46%;right:2%}.s3{bottom:12%;left:35%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:22px 0 34px}
.stat{display:flex;align-items:center;gap:14px;background:#111;border:1px solid #292929;border-radius:12px;padding:16px 18px}
.stat-num{font-size:27px;line-height:1;color:var(--yellow);font-weight:950;letter-spacing:-1px}
.stat-label{font-size:9px;line-height:1.6;letter-spacing:1.1px;color:#a9a9a9;font-weight:850}
.apps-section{padding:4px 0 55px}
.section-top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}
.section-eyebrow{font-size:9px;letter-spacing:2px;color:var(--yellow);font-weight:900;margin-bottom:9px}
.section-title{font-size:27px;letter-spacing:-.8px;font-weight:900;margin:0}
.section-sub{font-size:12px;color:#aaa;margin:8px 0 0;line-height:1.6}
.section-count{white-space:nowrap;color:#111;background:var(--yellow);font-size:10px;letter-spacing:1px;font-weight:950;border-radius:7px;padding:10px 12px}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.app-card{position:relative;min-width:0;min-height:228px;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--white);border:1px solid #fff;border-radius:15px;padding:19px;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.app-card:before{content:"";position:absolute;right:-43px;top:-52px;width:125px;height:125px;border-radius:50%;border:1px solid #FFD400;box-shadow:0 0 0 13px #FFD4000d,0 0 0 27px #FFD40008}
.app-card:nth-child(4n+2){background:linear-gradient(145deg,#171d2b,#05070d);color:#fff;border-color:#27334b}
.app-card:nth-child(4n+2) h2{color:#fff}.app-card:nth-child(4n+2) p{color:#c1c9d8}.app-card:nth-child(4n+2) .app-open{color:var(--yellow);border-top-color:#30394b}.app-card:nth-child(4n+2) .app-index{color:var(--yellow)}.app-card:nth-child(4n+2) .app-icon{background:#172b50;border-color:#245bb5;color:var(--yellow)}
.app-card:nth-child(4n+3){background:linear-gradient(145deg,#0756D9,#063b96);color:#fff;border-color:#1c6ce8}
.app-card:nth-child(4n+3) h2{color:#fff}.app-card:nth-child(4n+3) p{color:#dbe8ff}.app-card:nth-child(4n+3) .app-open{color:#ffe66d;border-top-color:#3978d0}.app-card:nth-child(4n+3) .app-index{color:#ffe66d}.app-card:nth-child(4n+3) .app-icon{background:#12458f;border-color:#6da4ff;color:#ffe66d}
.app-card:nth-child(4n){background:linear-gradient(145deg,#ffe66d,#FFD400);color:#171717;border-color:#e4bd00}
.app-card:nth-child(4n) h2{color:#171717}.app-card:nth-child(4n) p{color:#403710}.app-card:nth-child(4n) .app-open{color:#171717;border-top-color:#c7a900}.app-card:nth-child(4n) .app-index{color:#4d4100}.app-card:nth-child(4n) .app-icon{background:#fff2a8;border-color:#c7a900;color:#171717}
.app-card:hover,.app-card:focus-visible{outline:none;transform:translateY(-5px);border-color:var(--yellow);box-shadow:0 18px 40px #0009,0 0 0 2px #FFD40020}
.app-top{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}
.app-icon{width:47px;height:47px;display:grid;place-items:center;border-radius:13px;background:#fffbd1;border:1px solid #f0d900;color:#181600;font-size:14px;font-weight:1000;letter-spacing:-.5px}
.app-index{font-size:10px;font-weight:900;letter-spacing:1px;color:#a0a0a0}
.app-card h2{position:relative;font-size:16px;line-height:1.3;letter-spacing:-.2px;margin:0 0 8px;font-weight:900}
.app-card p{position:relative;color:#646464;font-size:11px;line-height:1.65;margin:0 0 22px}
.app-open{position:relative;margin-top:auto;padding-top:12px;border-top:1px solid #e7e7e7;display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:1px;font-weight:950;color:#222}
.app-open b{width:28px;height:28px;display:grid;place-items:center;background:var(--yellow);border-radius:50%;font-size:17px}
.footer{border-top:1px solid #ffffff20;padding:20px 0 25px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#7d7d7d;font-size:9px;letter-spacing:1px}
.footer strong{color:#eee}
@media(max-width:950px){.app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1.1fr .8fr}.hero-visual{transform:scale(.88)}}
@media(max-width:700px){.shell{width:calc(100% - 28px)}.topbar{height:68px}.top-tag{display:none}.promo-wrap{padding:14px 0 2px}.promo-frame{border-radius:12px}.promo-frame img{max-height:none;width:100%}.promo-link{width:100%;font-size:10px;padding:0 12px}.hero{grid-template-columns:1fr;min-height:auto;padding:42px 0 30px}.hero-visual{display:none}h1{font-size:clamp(43px,11vw,62px);letter-spacing:-2.8px}.hero-copy p{font-size:13px}.stats{gap:8px;padding:17px 0 29px}.stat{padding:13px 10px;gap:8px;align-items:flex-start;flex-direction:column}.stat-num{font-size:23px}.stat-label{font-size:8px}.app-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.app-card{padding:14px;min-height:213px}.app-top{margin-bottom:15px}.app-icon{width:40px;height:40px}.app-card h2{font-size:14px}.section-title{font-size:23px}.section-sub{font-size:11px}}
@media(max-width:370px){.brand-name{font-size:16px}.brand-label{letter-spacing:1.7px}.live{padding:8px;font-size:0}.live:before{margin:0}.app-grid{grid-template-columns:1fr}.app-card{min-height:175px}.app-card p{font-size:12px}.stats{grid-template-columns:1fr}.stat{flex-direction:row;align-items:center}.stat-label{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
